services:
  - type: web
    name: stitchtrack-laundry
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: STITCHTRACK_DB_URL
        sync: false
      - key: STITCHTRACK_DB_USER
        sync: false
      - key: STITCHTRACK_DB_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
